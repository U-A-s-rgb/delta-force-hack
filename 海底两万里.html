<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>海底两万里 · 海洋探险</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{
    --deep:#0a1e3a; --deep2:#06142a; --mid:#16385f; --light:#2a6fb5;
    --gold:#d4a84c; --silver:#c8d4e0; --cream:#f0e3c8; --sand:#d4b896;
    --ink:#0d1b2a; --paper:#fbf5e6; --coral:#ff7a6b; --teal:#3fb8af;
  }
  body{
    font-family:"Comic Sans MS","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--deep2); color:#eaf2ff; overflow:hidden; height:100vh;
    user-select:none; -webkit-tap-highlight-color:transparent;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* ===== 舞台 ===== */
  #stage{ position:relative; width:100vw; height:100vh; overflow:hidden; }

  /* ===== 场景背景 ===== */
  .scene{ position:absolute; inset:0; transition:opacity 1s ease; opacity:0; }
  .scene.active{ opacity:1; }
  .scene-surface{
    background:linear-gradient(180deg,#5ba8e0 0%,#2a6fb5 45%,#16385f 100%);
  }
  .scene-storm{
    background:linear-gradient(180deg,#1a2a40 0%,#0d1b2a 60%,#06142a 100%);
  }
  .scene-sub{
    background:linear-gradient(180deg,#0d2240 0%,#081830 50%,#040e20 100%);
  }
  .scene-forest{
    background:linear-gradient(180deg,#0a3a5c 0%,#062a4a 40%,#04203a 100%);
  }
  .scene-ice{
    background:linear-gradient(180deg,#8fc4e8 0%,#4a8bc0 40%,#1a4a70 100%);
  }
  .scene-ending{
    background:linear-gradient(180deg,#1a3a6a 0%,#0a2348 50%,#04122a 100%);
  }

  /* 太阳/光斑 */
  .sun{
    position:absolute; top:8%; right:12%; width:90px; height:90px; border-radius:50%;
    background:radial-gradient(circle,#fff6cf 0%,#ffe27a 50%,rgba(255,226,122,0) 75%);
    filter:blur(1px);
  }
  .light-rays{
    position:absolute; top:-10%; left:30%; width:40%; height:80%;
    background:linear-gradient(180deg,rgba(255,255,200,0.18),rgba(255,255,200,0));
    transform:skewX(-12deg); pointer-events:none;
  }

  /* 气泡 */
  .bubbles{ position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bubble{
    position:absolute; bottom:-30px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.6),rgba(255,255,255,0.05));
    border:1px solid rgba(255,255,255,0.2);
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.5; }
    100%{ transform:translateY(-105vh) translateX(20px); opacity:0; }
  }

  /* 海面波浪 */
  .waves{ position:absolute; bottom:30%; width:200%; height:80px; left:-50%;
    background:repeating-linear-gradient(90deg,transparent 0,transparent 40px,rgba(255,255,255,0.08) 40px,rgba(255,255,255,0.08) 80px);
    animation:wave 8s linear infinite;
  }
  @keyframes wave{ from{ transform:translateX(0);} to{ transform:translateX(-80px);} }

  /* 珊瑚剪影 */
  .coral{ position:absolute; bottom:0; width:100%; height:35%; pointer-events:none; }

  /* ===== 顶部状态栏 ===== */
  #hud{
    position:absolute; top:0; left:0; right:0; z-index:30;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 18px; background:linear-gradient(180deg,rgba(4,10,24,0.85),rgba(4,10,24,0));
    pointer-events:none;
  }
  #chapterTag{
    background:rgba(10,30,58,0.8); border:1px solid var(--gold);
    color:var(--gold); padding:5px 14px; border-radius:20px; font-size:13px; font-weight:bold;
  }
  #stats{ display:flex; gap:10px; }
  .stat{
    background:rgba(10,30,58,0.8); border-radius:14px; padding:4px 10px;
    display:flex; align-items:center; gap:6px; font-size:12px;
    border:1px solid rgba(255,255,255,0.15);
  }
  .stat .ic{ font-size:16px; }
  .stat .bar{ width:60px; height:8px; background:rgba(255,255,255,0.15); border-radius:4px; overflow:hidden; }
  .stat .fill{ height:100%; border-radius:4px; transition:width .5s; }
  #curiosity .fill{ background:var(--teal); }
  #trust .fill{ background:var(--gold); }
  #knowledge .fill{ background:var(--coral); }

  /* ===== 立绘 ===== */
  #portraits{
    position:absolute; bottom:0; left:0; right:0; height:62%; z-index:10;
    display:flex; justify-content:space-between; align-items:flex-end; padding:0 2%;
    pointer-events:none;
  }
  .portrait{ height:95%; max-width:42%; transition:all .5s ease; opacity:0; transform:translateY(20px); }
  .portrait.show{ opacity:1; transform:translateY(0); }
  .portrait.active{ filter:drop-shadow(0 0 18px rgba(212,168,76,0.5)); }
  .portrait.dim{ filter:brightness(0.6) saturate(0.7); transform:translateY(10px) scale(0.95); }
  .portrait svg, .portrait img{ width:100%; height:100%; object-fit:contain; }

  /* ===== 对话框 ===== */
  #dialogueBox{
    position:absolute; bottom:0; left:0; right:0; z-index:20;
    background:linear-gradient(180deg,rgba(8,20,40,0.92),rgba(4,12,28,0.98));
    border-top:3px solid var(--gold);
    padding:14px 22px 20px; min-height:30vh;
    box-shadow:0 -10px 40px rgba(0,0,0,0.6);
    cursor:pointer;
  }
  #speakerName{
    display:inline-block; background:var(--gold); color:var(--ink);
    padding:4px 18px; border-radius:0 0 14px 14px; font-weight:bold; font-size:15px;
    margin-bottom:8px; margin-left:14px;
  }
  #speakerName.nemo{ background:var(--mid); color:var(--silver); border:1px solid var(--gold); }
  #speakerName.aronnax{ background:var(--cream); color:var(--ink); }
  #speakerName.ned{ background:var(--coral); color:#fff; }
  #speakerName.narrator{ background:var(--silver); color:var(--ink); }
  #dialogueText{
    font-size:17px; line-height:1.7; min-height:60px; padding:6px 8px;
    color:#eaf2ff; text-shadow:0 1px 2px rgba(0,0,0,0.6);
  }
  #dialogueText .cursor{ animation:blink 0.8s infinite; color:var(--gold); }
  @keyframes blink{ 50%{ opacity:0; } }

  /* 选项 */
  #choices{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .choice{
    background:rgba(22,56,95,0.7); border:2px solid var(--light); color:#eaf2ff;
    padding:10px 16px; border-radius:12px; cursor:pointer; font-size:15px;
    transition:all .2s; text-align:left; font-family:inherit;
  }
  .choice:hover{ background:var(--mid); border-color:var(--gold); transform:translateX(6px); }
  .choice .tag{ font-size:11px; color:var(--teal); margin-left:8px; }

  /* 继续提示 */
  #continueHint{
    text-align:right; color:var(--gold); font-size:13px; margin-top:6px; opacity:0.7;
    animation:pulse 1.4s infinite;
  }
  @keyframes pulse{ 50%{ opacity:0.3; } }

  /* ===== 标题屏 ===== */
  #titleScreen{
    position:absolute; inset:0; z-index:100;
    background:radial-gradient(ellipse at center,#0a2a4a 0%,#04122a 70%,#020a1a 100%);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:20px;
  }
  #titleScreen h1{
    font-size:clamp(36px,7vw,68px); color:var(--cream);
    text-shadow:0 0 20px var(--light),0 4px 8px rgba(0,0,0,0.8);
    letter-spacing:4px; margin-bottom:6px;
  }
  #titleScreen .sub{ color:var(--teal); font-size:16px; margin-bottom:30px; letter-spacing:2px; }
  .char-cards{ display:flex; gap:24px; flex-wrap:wrap; justify-content:center; margin-bottom:30px; }
  .char-card{
    background:rgba(10,30,58,0.7); border:2px solid var(--mid); border-radius:16px;
    padding:16px; width:230px; backdrop-filter:blur(4px);
  }
  .char-card .pic{ height:180px; margin-bottom:10px; }
  .char-card .pic svg, .char-card .pic img{ width:100%; height:100%; object-fit:contain; }
  .char-card h3{ color:var(--gold); font-size:18px; margin-bottom:6px; }
  .char-card .tags{ font-size:12px; color:var(--teal); margin-bottom:6px; }
  .char-card .quote{ font-size:12px; color:var(--cream); font-style:italic; }
  .char-card .skill{ font-size:11px; color:var(--silver); margin-top:4px; }
  .start-btn{
    background:linear-gradient(135deg,var(--gold),#b8902c); color:var(--ink);
    border:none; padding:14px 50px; font-size:20px; font-weight:bold; border-radius:30px;
    cursor:pointer; box-shadow:0 6px 20px rgba(212,168,76,0.5); transition:transform .2s;
    font-family:inherit; letter-spacing:2px;
  }
  .start-btn:hover{ transform:scale(1.05); }
  .hint{ color:rgba(255,255,255,0.4); font-size:12px; margin-top:18px; }

  /* 章节卡 */
  #chapterCard{
    position:absolute; inset:0; z-index:90; display:none;
    align-items:center; justify-content:center; text-align:center;
    background:rgba(4,10,24,0.92);
  }
  #chapterCard .ch-num{ color:var(--teal); font-size:18px; letter-spacing:6px; }
  #chapterCard .ch-title{
    color:var(--gold); font-size:clamp(28px,5vw,48px); margin-top:8px;
    text-shadow:0 0 20px var(--mid); letter-spacing:3px;
  }
  #chapterCard .ch-line{ width:120px; height:2px; background:var(--gold); margin:18px auto; }

  /* 教育小知识弹窗 */
  #factPop{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) scale(0.8);
    z-index:80; max-width:440px; opacity:0; pointer-events:none; transition:all .4s;
  }
  #factPop.show{ opacity:1; transform:translate(-50%,-50%) scale(1); pointer-events:auto; cursor:pointer; }
  #factPop .card{
    background:linear-gradient(135deg,var(--paper),#f5e8cc); color:var(--ink);
    border:3px solid var(--gold); border-radius:18px; padding:20px;
    box-shadow:0 10px 40px rgba(0,0,0,0.6);
  }
  #factPop .badge{
    display:inline-block; background:var(--coral); color:#fff; font-size:11px;
    padding:3px 12px; border-radius:10px; margin-bottom:8px;
  }
  #factPop h4{ color:var(--mid); font-size:18px; margin-bottom:8px; }
  #factPop p{ font-size:14px; line-height:1.6; }
  #factPop .close{ margin-top:12px; text-align:center; color:var(--gold); font-size:13px; }

  /* 结局 */
  #endingScreen{
    position:absolute; inset:0; z-index:95; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:30px; background:rgba(4,10,24,0.95);
  }
  #endingScreen h2{ color:var(--gold); font-size:36px; margin-bottom:14px; text-shadow:0 0 20px var(--mid); }
  #endingScreen .end-text{ max-width:560px; color:#eaf2ff; font-size:16px; line-height:1.8; margin-bottom:18px; }
  #endingScreen .scores{ display:flex; gap:20px; margin-bottom:24px; }
  #endingScreen .score-item{ background:rgba(10,30,58,0.8); border-radius:12px; padding:10px 18px; }
  #endingScreen .score-item .v{ font-size:24px; color:var(--gold); font-weight:bold; }
  #endingScreen .score-item .l{ font-size:11px; color:var(--teal); }
  .replay-btn{
    background:var(--mid); color:var(--silver); border:2px solid var(--gold);
    padding:10px 30px; border-radius:25px; cursor:pointer; font-size:15px; font-family:inherit;
  }
  .replay-btn:hover{ background:var(--gold); color:var(--ink); }

  /* ===== 移动端适配 ===== */
  @media screen and (max-width: 768px){
    /* 顶部状态栏 */
    #hud{ padding:6px 10px; flex-wrap:wrap; gap:6px; }
    #chapterTag{ font-size:11px; padding:3px 10px; order:1; }
    #stats{ gap:4px; order:2; width:100%; justify-content:space-between; }
    .stat{ padding:3px 7px; font-size:10px; gap:3px; }
    .stat .ic{ font-size:13px; }
    .stat .bar{ width:40px; height:6px; }

    /* 立绘区 - 缩小并避免遮挡对话框 */
    #portraits{ height:45%; padding:0 3%; }
    .portrait{ max-width:38%; height:90%; }
    .portrait.active{ filter:drop-shadow(0 0 10px rgba(212,168,76,0.5)); }

    /* 对话框 */
    #dialogueBox{
      padding:10px 14px 14px; min-height:38vh;
      padding-bottom:calc(14px + env(safe-area-inset-bottom));
    }
    #speakerName{ font-size:12px; padding:3px 12px; margin-left:8px; margin-bottom:4px; }
    #dialogueText{ font-size:14px; line-height:1.6; min-height:50px; padding:4px 4px; }

    /* 选项按钮 - 加大触控面积 */
    #choices{ gap:6px; margin-top:8px; }
    .choice{ padding:12px 14px; font-size:14px; border-radius:10px; min-height:44px; }
    .choice:hover{ transform:none; }
    .choice:active{ background:var(--mid); border-color:var(--gold); }
    .choice .tag{ font-size:10px; }

    /* 继续提示 */
    #continueHint{ font-size:11px; }

    /* 标题屏 */
    #titleScreen{ padding:16px; }
    #titleScreen .sub{ font-size:13px; margin-bottom:18px; letter-spacing:1px; }
    .char-cards{ gap:14px; margin-bottom:20px; }
    .char-card{ width:160px; padding:12px; }
    .char-card .pic{ height:130px; }
    .char-card h3{ font-size:15px; }
    .char-card .tags{ font-size:10px; }
    .char-card .quote{ font-size:10px; }
    .char-card .skill{ font-size:10px; }
    .start-btn{ padding:12px 36px; font-size:17px; letter-spacing:1px; }
    .hint{ font-size:10px; margin-top:12px; }

    /* 章节卡 */
    #chapterCard .ch-num{ font-size:14px; letter-spacing:4px; }
    #chapterCard .ch-line{ width:80px; margin:12px auto; }

    /* 小知识弹窗 */
    #factPop{ max-width:90vw; top:45%; }
    #factPop .card{ padding:14px; }
    #factPop h4{ font-size:16px; }
    #factPop p{ font-size:13px; line-height:1.5; }
    #factPop .close{ font-size:11px; }

    /* 结局页 */
    #endingScreen{ padding:20px; }
    #endingScreen h2{ font-size:26px; }
    #endingScreen .end-text{ font-size:14px; line-height:1.6; }
    #endingScreen .scores{ gap:10px; flex-wrap:wrap; justify-content:center; }
    #endingScreen .score-item{ padding:8px 12px; }
    #endingScreen .score-item .v{ font-size:20px; }
    #endingScreen .score-item .l{ font-size:10px; }
    .replay-btn{ padding:10px 22px; font-size:14px; }
  }

  /* 小屏幕手机 (<390px) */
  @media screen and (max-width: 390px){
    #stats{ gap:3px; }
    .stat{ padding:2px 5px; font-size:9px; }
    .stat .bar{ width:32px; height:5px; }
    #portraits{ height:40%; }
    .portrait{ max-width:36%; }
    #dialogueBox{ min-height:42vh; padding:8px 10px 12px; }
    #dialogueText{ font-size:13px; line-height:1.5; }
    .char-card{ width:140px; }
    .char-card .pic{ height:110px; }
    .char-card h3{ font-size:14px; }
  }

  /* 横屏模式优化 */
  @media screen and (max-height: 500px) and (orientation: landscape){
    #portraits{ height:30%; }
    #dialogueBox{ min-height:50px; padding:8px 14px; }
    #dialogueText{ font-size:13px; min-height:40px; }
    #choices{ flex-direction:row; gap:6px; }
    .choice{ flex:1; font-size:13px; padding:8px 12px; }
    .char-card{ width:140px; }
    .char-card .pic{ height:100px; }
  }
</style>
</head>
<body>
<div id="stage">

  <!-- 场景背景层 -->
  <div class="scene scene-surface" data-scene="surface">
    <div class="sun"></div><div class="light-rays"></div>
    <div class="waves"></div>
    <svg class="coral" viewBox="0 0 1200 300" preserveAspectRatio="none">
      <path d="M0,300 L0,200 Q60,150 120,200 Q180,120 240,200 L240,300Z" fill="#06142a" opacity="0.6"/>
      <path d="M600,300 L600,180 Q660,100 720,180 L720,300Z" fill="#06142a" opacity="0.6"/>
      <path d="M900,300 L900,210 Q960,140 1020,210 L1020,300Z" fill="#06142a" opacity="0.6"/>
    </svg>
  </div>
  <div class="scene scene-storm" data-scene="storm"><div class="bubbles" data-b="8"></div></div>
  <div class="scene scene-sub" data-scene="sub"><div class="bubbles" data-b="14"></div></div>
  <div class="scene scene-forest" data-scene="forest"><div class="bubbles" data-b="18"></div>
    <svg class="coral" viewBox="0 0 1200 300" preserveAspectRatio="none">
      <path d="M0,300 L0,150 Q40,60 80,150 Q120,30 160,150 Q200,80 240,150 L240,300Z" fill="#1a4a3a" opacity="0.5"/>
      <path d="M300,300 L300,120 Q340,40 380,120 L380,300Z" fill="#2a6a4a" opacity="0.5"/>
      <path d="M500,300 L500,170 Q540,80 580,170 Q620,50 660,170 L660,300Z" fill="#1a4a3a" opacity="0.5"/>
      <path d="M750,300 L750,140 Q790,50 830,140 L830,300Z" fill="#2a6a4a" opacity="0.5"/>
      <path d="M950,300 L950,160 Q990,70 1030,160 Q1070,40 1110,160 L1110,300Z" fill="#1a4a3a" opacity="0.5"/>
    </svg>
  </div>
  <div class="scene scene-ice" data-scene="ice"><div class="bubbles" data-b="10"></div></div>
  <div class="scene scene-ending" data-scene="ending"><div class="bubbles" data-b="12"></div></div>

  <!-- 顶部状态栏 -->
  <div id="hud">
    <div id="chapterTag">序章</div>
    <div id="stats">
      <div class="stat" id="curiosity"><span class="ic">🔭</span><div class="bar"><div class="fill" style="width:30%"></div></div></div>
      <div class="stat" id="trust"><span class="ic">⚓</span><div class="bar"><div class="fill" style="width:20%"></div></div></div>
      <div class="stat" id="knowledge"><span class="ic">📖</span><div class="bar"><div class="fill" style="width:10%"></div></div></div>
    </div>
  </div>

  <!-- 立绘层 -->
  <div id="portraits">
    <div class="portrait" id="pLeft"></div>
    <div class="portrait" id="pRight"></div>
  </div>

  <!-- 教育小知识 -->
  <div id="factPop"><div class="card">
    <span class="badge">🔬 海洋小知识</span>
    <h4 id="factTitle"></h4>
    <p id="factText"></p>
    <div class="close">点击任意处继续 ▸</div>
  </div></div>

  <!-- 章节卡 -->
  <div id="chapterCard">
    <div class="ch-num" id="chNum"></div>
    <div class="ch-line"></div>
    <div class="ch-title" id="chTitle"></div>
  </div>

  <!-- 对话框 -->
  <div id="dialogueBox">
    <span id="speakerName">旁白</span>
    <div id="dialogueText"></div>
    <div id="choices"></div>
    <div id="continueHint" style="display:none">点击继续 ▾</div>
  </div>

  <!-- 标题屏 -->
  <div id="titleScreen">
    <h1>海底两万里</h1>
    <div class="sub">～ 一场深海探险的奇妙旅程 ～</div>
    <div class="char-cards">
      <div class="char-card">
        <div class="pic" id="cardNemo"></div>
        <h3>尼摩船长</h3>
        <div class="tags">神秘 · 善良 · 亦正亦邪</div>
        <div class="skill">技能：操控潜艇 · 海底救援 · 收集宝藏</div>
        <div class="quote">「大海不会懂得什么叫暴政！」</div>
      </div>
      <div class="char-card">
        <div class="pic" id="cardAronnax"></div>
        <h3>阿龙纳斯教授</h3>
        <div class="tags">博学 · 好奇 · 热爱科学</div>
        <div class="skill">技能：识别海洋生物 · 记录见闻 · 解谜</div>
        <div class="quote">「我从未见过如此壮丽的海底世界！」</div>
      </div>
    </div>
    <button class="start-btn" id="startBtn">开始探险</button>
    <div class="hint">提示：点击对话框推进剧情，选择不同选项会走向不同结局</div>
  </div>

  <!-- 结局屏 -->
  <div id="endingScreen">
    <h2 id="endTitle"></h2>
    <div class="end-text" id="endText"></div>
    <div class="scores">
      <div class="score-item"><div class="v" id="sCurio">0</div><div class="l">科学好奇心</div></div>
      <div class="score-item"><div class="v" id="sTrust">0</div><div class="l">尼摩信任度</div></div>
      <div class="score-item"><div class="v" id="sKnow">0</div><div class="l">海洋知识</div></div>
    </div>
    <button class="replay-btn" id="replayBtn">重新开始探险</button>
  </div>
</div>

<!-- ============ 角色 SVG 定义 ============ -->
<svg width="0" height="0" style="position:absolute">

/* ===================== 游戏引擎 ===================== */
const state = { node:"start", curiosity:30, trust:20, knowledge:10, typing:false, queue:null };

const $ = id => document.getElementById(id);
const speakerName = $("speakerName");
const dialogueText = $("dialogueText");
const choicesEl = $("choices");
const continueHint = $("continueHint");
const chapterTag = $("chapterTag");
const pLeft = $("pLeft"), pRight = $("pRight");

function setScene(name){
  document.querySelectorAll(".scene").forEach(s=>{
    s.classList.toggle("active", s.dataset.scene===name);
  });
}
function setPortrait(side, who, active){
  const el = side==="left"?pLeft:pRight;
  if(!who){ el.classList.remove("show","active","dim"); el.innerHTML=""; return; }
  const cap = who.charAt(0).toUpperCase()+who.slice(1);
  const pngMap = { nemo:"nemo", aronnax:"aronnax", ned:"ned" };
  const fname = pngMap[who] || who;
  const imgSrc = fname + ".jpg";
  el.innerHTML = `<img src="${imgSrc}" style="width:100%;height:100%;object-fit:contain;display:block" />
    <svg style="display:none;width:100%;height:100%"><use href="#svg${cap}"/></svg>`;
  const img = el.querySelector("img");
  const svg = el.querySelector("svg");
  img.addEventListener("error", ()=>{
    img.style.display = "none";
    svg.style.display = "block";
  });
  img.addEventListener("load", ()=>{
    img.style.display = "block";
    svg.style.display = "none";
  });
  el.classList.add("show");
  el.classList.toggle("active", active);
  el.classList.toggle("dim", !active);
}
function updateStats(){
  $("curiosity").querySelector(".fill").style.width = Math.min(100,state.curiosity)+"%";
  $("trust").querySelector(".fill").style.width = Math.min(100,state.trust)+"%";
  $("knowledge").querySelector(".fill").style.width = Math.min(100,state.knowledge)+"%";
}
function applyEff(eff){
  if(!eff) return;
  if(eff.curiosity) state.curiosity = Math.max(0, state.curiosity+eff.curiosity*5);
  if(eff.trust) state.trust = Math.max(0, state.trust+eff.trust*5);
  if(eff.knowledge) state.knowledge = Math.max(0, state.knowledge+eff.knowledge*5);
  updateStats();
}
function showChapter(num, title){
  $("chNum").textContent = num;
  $("chTitle").textContent = title;
  const card = $("chapterCard");
  card.style.display = "flex";
  card.style.opacity = 0;
  setTimeout(()=>{ card.style.transition="opacity .5s"; card.style.opacity=1; }, 20);
  setTimeout(()=>{
    card.style.opacity = 0;
    setTimeout(()=>{ card.style.display="none"; }, 500);
  }, 2000);
}

let typeTimer = null;
function typewriter(text, done){
  state.typing = true;
  continueHint.style.display = "none";
  choicesEl.innerHTML = "";
  dialogueText.innerHTML = "";
  let i = 0;
  const speed = 32;
  function step(){
    if(i < text.length){
      dialogueText.innerHTML = text.slice(0,i+1) + '<span class="cursor">▌</span>';
      i++;
      typeTimer = setTimeout(step, speed);
    } else {
      dialogueText.innerHTML = text;
      state.typing = false;
      done && done();
    }
  }
  step();
}
function skipType(text){
  if(typeTimer) clearTimeout(typeTimer);
  dialogueText.innerHTML = text;
  state.typing = false;
}

function showFact(f){
  $("factTitle").textContent = f.title;
  $("factText").textContent = f.text;
  const pop = $("factPop");
  pop.classList.add("show");
  const close = ()=>{ pop.classList.remove("show"); pop.removeEventListener("click",close); 
    // 显示 fact 后继续到当前节点对话
    renderNode(state.node, true);
  };
  pop.addEventListener("click", close);
}

function renderNode(id, afterFact){
  const node = STORY[id];
  if(!node) return;
  state.node = id;

  // 结局
  if(node.isEnding){ showEnding(node); return; }

  // 章节标题
  if(node.chapter){
    const parts = node.chapter.split("·");
    showChapter(parts[0].trim(), (parts[1]||"").trim());
    chapterTag.textContent = node.chapter;
  }

  // 场景
  if(node.scene) setScene(node.scene);

  // 教育小知识（先弹窗，再渲染对话）
  if(node.fact && !afterFact){
    showFact(node.fact);
    return;
  }

  // 立绘
  const sp = node.speaker;
  if(sp==="nemo"){ setPortrait("right","nemo",true); setPortrait("left",null); }
  else if(sp==="aronnax"){ setPortrait("left","aronnax",true); setPortrait("right",null); }
  else if(sp==="ned"){ setPortrait("right","ned",true); setPortrait("left",null); }
  else {
    // 旁白：若有上一立绘则保留 dim，否则清空
    setPortrait("left",null); setPortrait("right",null);
  }

  // 说话人
  speakerName.textContent = node.name||"";
  speakerName.className = sp||"narrator";

  // 对话
  typewriter(node.text, ()=>{
    if(node.choices && node.choices.length){
      renderChoices(node.choices);
    } else if(node.next){
      continueHint.style.display = "block";
    }
  });
}

function renderChoices(list){
  choicesEl.innerHTML = "";
  continueHint.style.display = "none";
  list.forEach(c=>{
    const btn = document.createElement("button");
    btn.className = "choice";
    btn.innerHTML = c.text + (c.tag?`<span class="tag">${c.tag}</span>`:"");
    btn.onclick = (e)=>{
      e.stopPropagation();
      applyEff(c.eff);
      renderNode(c.next);
    };
    choicesEl.appendChild(btn);
  });
}

function showEnding(node){
  setScene("ending");
  setPortrait("left","aronnax",false);
  setPortrait("right","nemo",false);
  $("endTitle").textContent = node.title;
  $("endText").textContent = node.text;
  $("sCurio").textContent = state.curiosity;
  $("sTrust").textContent = state.trust;
  $("sKnow").textContent = state.knowledge;
  $("dialogueBox").style.display = "none";
  $("endingScreen").style.display = "flex";
}

// 点击对话框推进
$("dialogueBox").addEventListener("click", e=>{
  // 如果点击的是选项按钮或其子元素，不处理
  let el = e.target;
  while(el && el !== $("dialogueBox")){
    if(el.classList && el.classList.contains("choice")) return;
    el = el.parentElement;
  }
  if(state.typing){
    skipType(STORY[state.node].text);
    const node = STORY[state.node];
    if(node.choices) renderChoices(node.choices);
    else if(node.next) continueHint.style.display="block";
    return;
  }
  const node = STORY[state.node];
  if(!node) return;
  if(node.choices && node.choices.length) return;
  if(node.next){ renderNode(node.next); }
});

// 开始按钮
$("startBtn").addEventListener("click", ()=>{
  $("titleScreen").style.display = "none";
  setScene("surface");
  renderNode("start");
});

// 重玩
$("replayBtn").addEventListener("click", ()=>{
  state.curiosity=30; state.trust=20; state.knowledge=10; state.node="start";
  updateStats();
  $("endingScreen").style.display="none";
  $("dialogueBox").style.display="block";
  renderNode("start");
});

// 角色卡片立绘
function setupCard(cardId, imgFile, svgId){
  const card = $(cardId);
  card.innerHTML = `<img src="${imgFile}" style="width:100%;height:100%;object-fit:contain;display:block" />
    <svg style="display:none;width:100%;height:100%"><use href="#${svgId}"/></svg>`;
  const img = card.querySelector("img");
  const svg = card.querySelector("svg");
  img.addEventListener("error", ()=>{
    img.style.display = "none";
    svg.style.display = "block";
  });
  img.addEventListener("load", ()=>{
    img.style.display = "block";
    svg.style.display = "none";
  });
}
setupCard("cardNemo", "nemo.jpg", "svgNemo");
setupCard("cardAronnax", "aronnax.jpg", "svgAronnax");

// 生成气泡
document.querySelectorAll(".bubbles").forEach(b=>{
  const n = parseInt(b.dataset.b)||10;
  for(let i=0;i<n;i++){
    const el = document.createElement("div");
    el.className="bubble";
    const size = 6 + Math.random()*22;
    el.style.width=size+"px"; el.style.height=size+"px";
    el.style.left = Math.random()*100+"%";
    el.style.animationDuration = (8+Math.random()*10)+"s";
    el.style.animationDelay = (Math.random()*10)+"s";
    b.appendChild(el);
  }
});

// 键盘快捷键：空格/回车推进剧情
document.addEventListener("keydown", e=>{
  if(e.code==="Space" || e.code==="Enter"){
    const fc = $("factPop");
    if(fc.classList.contains("show")){
      e.preventDefault();
      fc.click();
      return;
    }
    const ts = $("titleScreen");
    if(ts.style.display !== "none" && ts.style.display !== "") return;
    const es = $("endingScreen");
    if(es.style.display === "flex") return;
    e.preventDefault();
    $("dialogueBox").click();
  }
});

// 触摸/点击事件：确保立绘区域不会阻挡对话框
document.addEventListener("click", e=>{
  if(e.target.closest("#portraits")){
    const db = $("dialogueBox");
    if(db.style.display !== "none"){
      const fakeEvent = new MouseEvent("click", {bubbles:true});
      db.dispatchEvent(fakeEvent);
    }
  }
});

updateStats();
