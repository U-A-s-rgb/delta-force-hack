<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G.T.I. 全球应急组织</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <div class="container">
    <!-- GTI 标志 -->
    <div class="logo-wrap">
      <svg class="gti-logo" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="glow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00ff9f" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#00b87a" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#000" stop-opacity="0"/>
          </radialGradient>
          <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.6" result="blur"/>
            <feMerge>
              <feMergeNode in="blur"/>
              <feMergeNode in="SourceGraphic"/>
            </feMerge>
          </filter>
        </defs>

        <!-- 背景光晕 -->
        <circle cx="100" cy="100" r="98" fill="url(#glow)"/>

        <!-- 外圈文字路径 -->
        <path id="topArc" d="M 30,100 A 70,70 0 0,1 170,100" fill="none"/>
        <path id="botArc" d="M 30,100 A 70,70 0 0,0 170,100" fill="none"/>

        <g filter="url(#neon)" stroke="#39ff9b" stroke-width="2.2" fill="none">
          <!-- 外圆环 -->
          <circle cx="100" cy="100" r="94"/>
          <circle cx="100" cy="100" r="88"/>
        </g>

        <!-- 外圈文字 -->
        <text fill="#39ff9b" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" filter="url(#neon)">
          <textPath href="#topArc" startOffset="50%" text-anchor="middle">GLOBAL THREAT INITIATIVE</textPath>
        </text>
        <text fill="#39ff9b" font-family="'Courier New', monospace" font-size="10" letter-spacing="2" filter="url(#neon)">
          <textPath href="#botArc" startOffset="50%" text-anchor="middle">GLOBAL THREAT INITIATIVE</textPath>
        </text>

        <!-- 内圆环 -->
        <circle cx="100" cy="100" r="66" fill="none" stroke="#39ff9b" stroke-width="1.6" filter="url(#neon)"/>

        <!-- 中心图案：倒三角 + 竖剑 + 横杠 -->
        <g filter="url(#neon)" fill="#39ff9b" stroke="#39ff9b" stroke-width="1.2">
          <!-- 上方横杠（T 的横） -->
          <rect x="60" y="62" width="80" height="9" rx="2"/>
          <!-- 左侧倒三角 -->
          <polygon points="60,71 100,130 100,71"/>
          <!-- 右侧倒三角 -->
          <polygon points="140,71 100,71 100,130"/>
          <!-- 中央竖剑 -->
          <rect x="96" y="40" width="8" height="90" rx="3"/>
          <!-- 剑尖 -->
          <polygon points="92,128 108,128 100,150"/>
          <!-- 剑格 -->
          <rect x="82" y="78" width="36" height="6" rx="2"/>
        </g>
      </svg>
    </div>

    <!-- 标题 -->
    <h1 class="title">G.T.I. 全球应急组织</h1>
    <p class="subtitle">GLOBAL THREAT INITIATIVE</p>

    <!-- 切换标签 -->
    <div class="tabs">
      <button class="tab active" data-tab="register">注册</button>
      <button class="tab" data-tab="login">登录</button>
    </div>

    <!-- 注册表单 -->
    <form id="registerForm" class="form active">
      <div class="field">
        <label>注册人员</label>
        <input type="text" id="regUsername" placeholder="请输入用户名" autocomplete="off">
      </div>
      <div class="field">
        <label>注册密码</label>
        <input type="password" id="regPassword" placeholder="6位，含数字、大小写字母" maxlength="6">
      </div>
      <div class="field">
        <label>确认密码</label>
        <input type="password" id="regPassword2" placeholder="再次输入密码" maxlength="6">
      </div>
      <button type="submit" class="btn">注 册</button>
      <p class="msg" id="regMsg"></p>
    </form>

    <!-- 登录表单 -->
    <form id="loginForm" class="form">
      <div class="field">
        <label>用户名</label>
        <input type="text" id="loginUsername" placeholder="请输入用户名" autocomplete="off">
      </div>
      <div class="field">
        <label>密码</label>
        <input type="password" id="loginPassword" placeholder="请输入密码" maxlength="20">
      </div>
      <button type="submit" class="btn">登 录</button>
      <p class="msg" id="loginMsg"></p>
    </form>

    <p class="tip">提示：管理员登录后将进入管理后台</p>
  </div>

  <script src="app.js"></script>
</body>
</html>
